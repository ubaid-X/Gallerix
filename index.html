<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="/src/css/style.css" />
  </head>
  <!-- padding =>  it will prevent the last gallery images from being hidden behind the footer. -->
  <body class="pb-20">
    <header>
      <nav>
        <!-- logo -->
        <a href="" class="text-3xl text-blue-500 block p-4 font-sans font-bold"
          >Gallerix</a
        >
      </nav>

      <!-- section about the gallery info -->
      <div class="mx-auto w-max">
        <h1 class="md:text-4xl lg:text-6xl font-semibold text-2xl">
          Simple Image Gallery
        </h1>
        <p
          class="my-2 text-sm md:text-xl lg:text-2xl text-gray-500 mx-auto w-max"
        >
          Explore beautiful photography with Gallerix
        </p>
      </div>
    </header>

    <!-- main part -->
    <main>
      <!-- button section -->
      <section
        class="btn-sec  flex flex-wrap justify-center gap-3 p-5"
      >
        <button
          class="btn-all gallery-filter border  border-blue-700  rounded-2xl p-3 bg-blue-700 text-white transition-all duration-100 my-2"
        >
          All
        </button>
        <button
          class="btn-nature gallery-filter border border-blue-700  rounded-2xl p-3 transition-all duration-100 my-2"
        >
          Nature
        </button>
        <button
          class="btn-arch gallery-filter  border border-blue-700  rounded-2xl p-3  transition-all duration-100 my-2"
        >
          Architecture
        </button>
        <button
          class="btn-urban gallery-filter  border border-blue-700  rounded-2xl p-3  transition-all duration-100 my-2"
        >
          Urban
        </button>
        <button
          class="btn-car gallery-filter  border border-blue-700 rounded-2xl p-3 transition-all duration-100 my-2"
        >
          Cars
        </button>
      </section>

      <!-- card sections -->

      <section
        class="cards-container columns-1 md:columns-2 lg:columns-3 gap-4 transition-opacity duration-300"
      ></section>

      <!-- card template -->
      <template class="card-template">
        <div
          class="card break-inside-avoid mb-4 overflow-hidden rounded-2xl shadow-2xl"
        >
          <img
            class="card-img rounded-2xl w-full h-auto object-cover block transition-transform duration-500 hover:scale-105"
            src=""
            alt="Image"
          />
        </div>
      </template>

      <!-- // image modal for showing the image in large size when clicked on it. -->

      <div
        class="image-overlay fixed inset-0 bg-black/70 hidden flex items-center justify-center z-10"
      >
        <div
          class="image-modal relative flex items-center justify-center max-w-[90vw] max-h-[90vh]"
        >
          <button
            class="close-btn absolute top-0 right-0 bg-red-500 text-white w-10 h-10 rounded-sm text-2xl"
          >
            ×
          </button>

          <img
            class="max-w-full max-h-[90vh] object-contain rounded-xl"
            src=""
            alt="image"
          />
        </div>
      </div>
    </main>
    <!-- footer  -->
    <footer
      class="text-white bg-blue-700 h-20 mt-3 flex justify-center items-center fixed bottom-0 left-0 w-full"
    >
      <p class="text-sm md:text-base">
    <span class="font-bold text-xl">Gallerix</span>
    built with ❤ by
    <a class="hover:underline font-bold" href="https://github.com/ubaid-X" alt="github link" target="_blank">Ubaidullah</a>
    </p>
    </footer>

    <script type="module" src="/src/js/main.js"></script>
  </body>
</html>
